[package]
name = "acswarm"
description = "The acswarm client: play, or run many sessions headless"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ctrlc = "3"
ac-dat = { path = "../../crates/ac-dat" }
ac-formats = { path = "../../crates/ac-formats" }
ac-scene = { path = "../../crates/ac-scene" }
ac-store = { path = "../../crates/ac-store" }
ac-net = { path = "../../crates/ac-net" }
ac-world = { path = "../../crates/ac-world" }
ac-audio = { path = "../../crates/ac-audio" }
ac-client = { path = "../../crates/ac-client" }
ac-plugin = { path = "../../crates/ac-plugin" }
ac-script = { path = "../../crates/ac-script" }
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
tracing.workspace = true
tracing-subscriber.workspace = true
glam = { workspace = true, features = ["bytemuck"] }
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
bytemuck = { version = "1", features = ["derive"] }
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
image = { workspace = true, features = ["png"] }
libc = "0.2"

[dev-dependencies]
# Live hal buffer counts, for the tests that check wgpu is not holding
# uploads (they read 0 without it).
wgpu = { workspace = true, features = ["counters"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"
