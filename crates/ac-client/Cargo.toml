[package]
name = "ac-client"
description = "A headless game session: connection, world, character, and gameplay commands, with no rendering"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Offline clients and world objects for tests (`ac_client::testkit`).
testkit = ["dep:ac-dat"]

[dependencies]
ac-agent = { path = "../ac-agent" }
ac-dat = { path = "../ac-dat", optional = true }
ac-nav = { path = "../ac-nav" }
ac-loot = { path = "../ac-loot" }
ac-vendor = { path = "../ac-vendor" }
ac-formats = { path = "../ac-formats" }
ac-net = { path = "../ac-net" }
ac-scene = { path = "../ac-scene" }
ac-store = { path = "../ac-store" }
ac-world = { path = "../ac-world" }
glam = "0.30"
serde.workspace = true
serde_json = "1"
regex.workspace = true
tracing.workspace = true

[dev-dependencies]
# The integration tests use the testkit too.
ac-client = { path = ".", features = ["testkit"] }
ac-dat = { path = "../ac-dat" }
tracing-subscriber.workspace = true
