[package]
name = "xtask"
description = "Repository chores run as `cargo run -p xtask -- <cmd>`: prove a change touched comments only, and list the facts its removed comments held"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
regex.workspace = true
# span-locations gives parsed tokens their line numbers, to point at a difference.
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
